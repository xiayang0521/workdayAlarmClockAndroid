plugins {
    id 'com.android.application'
}

android {
    namespace "com.zyyme.workdayviewer"
    compileSdk 32

    defaultConfig {
        applicationId "com.zyyme.workdayviewer"
        minSdk 17
        targetSdk 32
        versionCode 19
        versionName "1.19"
    }

    buildTypes {
        release {
            debuggable false
            zipAlignEnabled true
            minifyEnabled false
        }
        debug {
            debuggable true
            zipAlignEnabled true
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
